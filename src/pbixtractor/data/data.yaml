# Visual types: display names and categories. Types listed here are "supported"; any other
# type is still extracted (generically) but logged, so it can be added here.
visual_type_metadata:
  # Standard visuals - auto-generate display names from camelCase
  standard_visuals:
    - lineClusteredColumnComboChart
    - clusteredColumnChart
    - clusteredBarChart
    - donutChart
    - azureMap
    - barChart
    - scatterChart
    - columnChart
    - hundredPercentStackedBarChart
    - hundredPercentStackedColumnChart
    - lineChart
    - areaChart
    - stackedAreaChart
    - lineStackedColumnComboChart
    - ribbonChart
    - waterfallChart
    - funnel
    - pieChart
    - treemap
    - map
    - filledMap
    - multiRowCard
    - kpi
    - keyDriversVisual
    - decompositionTreeVisual
  
  # Special visuals with custom display names
  special_visuals:
    tableEx:
      display_name: "Table"
      item_type: "Visual"
    pivotTable:
      display_name: "Matrix"
      item_type: "Visual"
    card:
      display_name: "Card"
      item_type: "Visual"
    cardVisual:
      display_name: "Card (new)"
      item_type: "Visual"
    gauge:
      display_name: "Gauge"
      item_type: "Visual"
    slicer:
      display_name: "Slicer"
      item_type: "Slicer"
    advancedSlicerVisual:
      display_name: "Slicer (new)"
      item_type: "Slicer"
    listSlicer:
      display_name: "Slicer (list)"
      item_type: "Slicer"
    textSlicer:
      display_name: "Slicer (text)"
      item_type: "Slicer"
    actionButton:
      display_name: "Button"
      item_type: "Button"
    Group:
      display_name: "Panel"
      item_type: "Group"
  
  # Button types (legacy - kept for compatibility)
  button_types:
    - Bookmark
    - PageNavigation
    - Button

# How each visual type is extracted (default for any other type: standard).
#   standard - the fields in the visual's query and formatting (charts, tables, slicers, ...)
#   button   - action type, target (bookmark/page/URL) and label
#   skip     - decoration, not documented (shapes/images WITH an action are still
#              documented as buttons)
extract_types:
  actionButton: button
  shape: skip
  image: skip
  textbox: skip
  pageNavigator: skip  # built-in page navigator: no fields, lists pages automatically
