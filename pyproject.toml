[project]
name = "pbixtractor"
version = "0.3.0"
description = "Power BI report documentation extractor with Tabular Editor integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Marcus Toftås" }
]
keywords = ["powerbi", "documentation", "dax", "tabular-editor", "business-intelligence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Software Development :: Documentation",
    "Topic :: Office/Business",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=2.0.0",
    "xlsxwriter>=3.2.0",
    "matplotlib>=3.8.0",
    "networkx>=3.0.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.3",
    "pydantic>=2.0.0",
    "nicegui>=3.0",
    "fastapi",  # imported directly (comes with nicegui)
    "sqlglot>=26",
    "azure-identity>=1.19",
    "pbixray>=0.15",  # reads the model inside a .pbix (MIT; native wheels for Windows + Linux)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
pbixtractor = "pbixtractor.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pbixtractor = [
    "data/*.yaml", "data/*.png", "data/*.ico", "data/*.json", "data/*.LICENSE",
    "data/fonts/*.woff2", "data/fonts/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
markers = ["tabular_editor: runs the real Tabular Editor 2 (slow; skipped if not installed)"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long (handled by black)
